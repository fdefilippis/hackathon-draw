<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown · 15:30</title>
  <style>
    :root {
      --bg: #05060a;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.45);
      --accent: #34d399;   /* emerald */
      --accent2: #fbbf24;  /* amber  */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(52, 211, 153, 0.12), transparent 60%),
        radial-gradient(1000px 700px at 90% 110%, rgba(251, 191, 36, 0.10), transparent 60%),
        var(--bg);
      color: var(--fg);
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 4vh, 3rem);
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.5em;
      font-size: clamp(0.75rem, 1.6vw, 1.15rem);
      color: var(--muted);
      font-weight: 600;
      padding-left: 0.5em;
    }

    .clock {
      display: flex;
      align-items: flex-start;
      gap: clamp(0.5rem, 2vw, 2rem);
      line-height: 1;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.4rem, 1.5vh, 1rem);
    }

    .digits {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: clamp(4rem, 20vw, 18rem);
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.72) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(52, 211, 153, 0.15);
      transition: transform 0.15s ease;
    }

    .unit-label {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: clamp(0.65rem, 1.2vw, 1rem);
      color: var(--muted);
      font-weight: 600;
    }

    .sep {
      font-weight: 800;
      font-size: clamp(3rem, 14vw, 13rem);
      color: rgba(255, 255, 255, 0.25);
      align-self: center;
      transform: translateY(-0.12em);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0.25; } }

    .target {
      font-size: clamp(0.85rem, 1.8vw, 1.35rem);
      color: var(--muted);
      font-weight: 500;
    }
    .target b { color: var(--accent2); font-weight: 700; }

    /* Stato: tempo scaduto */
    body.done {
      background:
        radial-gradient(1400px 900px at 50% 50%, rgba(52, 211, 153, 0.25), transparent 65%),
        var(--bg);
    }
    body.done .clock, body.done .label, body.done .target { display: none; }

    .done-msg {
      display: none;
      font-weight: 900;
      font-size: clamp(3rem, 16vw, 15rem);
      text-align: center;
      background: linear-gradient(180deg, var(--accent) 0%, #a7f3d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pop 0.6s ease;
    }
    body.done .done-msg { display: block; }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }

    .hint {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="label">Si riparte tra</div>

  <div class="clock" id="clock">
    <div class="unit">
      <div class="digits" id="hh">00</div>
      <div class="unit-label">ore</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="digits" id="mm">00</div>
      <div class="unit-label">min</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="digits" id="ss">00</div>
      <div class="unit-label">sec</div>
    </div>
  </div>

  <div class="target">Ritrovo alle <b>15:30</b></div>

  <div class="done-msg">È ORA! 🚀</div>

  <div class="hint" id="hint">Premi F per schermo intero</div>

  <script>
    // Target: oggi alle 15:30 (ora locale)
    const TARGET_H = 15;
    const TARGET_M = 30;

    function targetDate() {
      const t = new Date();
      t.setHours(TARGET_H, TARGET_M, 0, 0);
      return t;
    }

    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    let target = targetDate();
    let finished = false;

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const diff = target - new Date();

      if (diff <= 0) {
        if (!finished) {
          finished = true;
          document.body.classList.add("done");
        }
        return;
      }

      const totalSec = Math.floor(diff / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      const nh = pad(h), nm = pad(m), ns = pad(s);
      if (hh.textContent !== nh) bump(hh, nh);
      if (mm.textContent !== nm) bump(mm, nm);
      if (ss.textContent !== ns) bump(ss, ns);

      document.title = `${nh}:${nm}:${ns} · 15:30`;
    }

    function bump(el, val) {
      el.textContent = val;
      el.style.transform = "scale(1.06)";
      requestAnimationFrame(() => setTimeout(() => (el.style.transform = "scale(1)"), 60));
    }

    tick();
    setInterval(tick, 250);

    // Fullscreen con tasto F
    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    // Nasconde l'hint dopo qualche secondo
    setTimeout(() => (document.getElementById("hint").style.opacity = "0"), 5000);
  </script>
</body>
</html>
